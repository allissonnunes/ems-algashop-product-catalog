management:
  endpoint:
    health:
      show-details: always
      group:
        readiness:
          include:
            - mongo
            - readinessState
        liveness:
          include:
            - livenessState
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  health:
    redis:
      enabled: false

spring:
  application:
    name: product-catalog
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    representation:
      uuid: standard
  web:
    locale-resolver: fixed
    locale: en_US

algashop:
  dataloader:
    enabled: false
    auto-delete: false